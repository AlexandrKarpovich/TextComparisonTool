name: Deploy to Server

on:
  push:
    branches: [ main ] # Убедитесь, что здесь указана ваша основная ветка

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1' # Укажите версию PHP, установленную на сервере

      # Если есть Composer-зависимости (сейчас их нет, но на будущее)
      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader || true

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "./"
          REMOTE_HOST: "77.232.128.98"
          REMOTE_USER: "root"
          TARGET: "/var/www/html/test" # Папка, куда скопируется проект
          EXCLUDE: "/.git/, /.github/, /node_modules/"